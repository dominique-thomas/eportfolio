<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ePortfolio</title>

    <!-- Link previews (LinkedIn, Slack, etc.). These can't come from data.js, so edit them per owner -->
    <meta name="description" content="Dominique Thomas designs learning experiences and the tools around them, from interactive content to the workflows behind it.">
    <meta property="og:title" content="Dominique Thomas | ePortfolio">
    <meta property="og:description" content="Learning experiences, simulations, and interactive tools.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="images/og-preview.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
        <div class="wrap header-inner">
            <a href="#top" class="brand" id="brandName"></a>

            <nav class="nav" aria-label="Main">
                <a href="#work">Work</a>
                <a href="#about">About</a>
                <a href="#toolkit">Toolkit</a>
                <a href="#contact">Let's connect</a>
            </nav>

            <button type="button" class="icon-btn menu-toggle" id="menuOpen" aria-label="Open menu" aria-controls="mobileMenu" aria-expanded="false">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            </button>
        </div>
    </header>

    <!-- Mobile menu -->
    <div class="mobile-menu" id="mobileMenu" hidden>
        <div class="wrap header-inner">
            <span class="brand" id="menuBrandName"></span>
            <button type="button" class="icon-btn" id="menuClose" aria-label="Close menu">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </div>
        <nav class="mobile-nav" aria-label="Mobile">
            <a href="#work">Work</a>
            <a href="#about">About</a>
            <a href="#toolkit">Toolkit</a>
            <a href="#contact">Let's connect</a>
        </nav>
        <div class="socials mobile-socials" id="menuSocials"></div>
    </div>

    <main id="main">
        <!-- Hero -->
        <section class="wrap hero" id="top">
            <h1 class="hero-title" id="heroTitle"></h1>
            <p class="hero-subline" id="heroSubline"></p>
        </section>

        <!-- Work -->
        <section class="wrap work" id="work">
            <h2 class="section-title">Featured project</h2>
            <div id="featuredProject"></div>

            <div class="more-work">
                <h2 class="section-subtitle">More work</h2>
                <div class="work-grid" id="workGrid"></div>
                <div class="more-work-footer">
                    <p class="blog-callout" id="blogCallout"></p>
                    <button type="button" class="btn btn-outline" id="showMore" aria-expanded="false" aria-controls="workGrid"></button>
                </div>
            </div>
        </section>

        <!-- About -->
        <section class="band about" id="about">
            <div class="wrap">
                <h2 class="section-title">About</h2>
                <div class="about-text" id="aboutText"></div>
            </div>
        </section>

        <!-- Toolkit -->
        <section class="wrap toolkit" id="toolkit">
            <h2 class="section-title">Toolkit</h2>
            <div class="toolkit-grid" id="toolkitGrid"></div>
        </section>

        <!-- Stats -->
        <section class="stats" id="stats" aria-label="At a glance">
            <div class="wrap stats-grid" id="statsGrid"></div>
        </section>

        <!-- Contact -->
        <section class="wrap contact" id="contact">
            <div>
                <h2 class="section-title" id="contactHeading"></h2>
                <p class="contact-text" id="contactText"></p>
            </div>
            <a class="btn btn-primary" id="contactButton" target="_blank" rel="noopener"></a>
        </section>
    </main>

    <footer class="site-footer">
        <div class="wrap footer-inner">
            <span id="footerCopy"></span>
            <div class="socials" id="footerSocials"></div>
        </div>
    </footer>

    <!-- Project view -->
    <dialog class="project-view" id="projectView" aria-labelledby="pvTitle">
        <div class="pv-bar">
            <div class="wrap pv-bar-inner">
                <button type="button" class="pv-back" id="pvClose">Return</button>
                <div class="pv-nav">
                    <span class="pv-count" id="pvCount" aria-live="polite"></span>
                    <button type="button" class="icon-btn" id="pvPrev" aria-label="Previous project">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
                    </button>
                    <button type="button" class="icon-btn" id="pvNext" aria-label="Next project">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
                    </button>
                </div>
            </div>
        </div>
        <div class="pv-body" id="pvBody"></div>
    </dialog>

    <!-- Scripts -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PDYGWDY613"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag("js", new Date());
        gtag("config", "G-PDYGWDY613");
    </script>
    <script src="js/data.js" defer></script>
    <script src="js/index.js" defer></script>
</body>

</html>
